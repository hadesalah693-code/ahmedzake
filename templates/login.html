<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - الوسام للخدمات الجامعية</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1e3a5f, #2d5a8e); }
    .login-box {
      background: #fff; border-radius: 16px; padding: 40px 32px;
      width: 90%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .login-box h1 { text-align: center; color: #1e3a5f; font-size: 1.3rem; margin-bottom: 6px; }
    .login-box .sub { text-align: center; color: #64748b; font-size: .9rem; margin-bottom: 28px; }
    .login-box .form-group { margin-bottom: 16px; }
    .login-box label { font-size: .85rem; font-weight: 600; color: #64748b; display: block; margin-bottom: 6px; }
    .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 1rem; font-family: inherit; }
    .login-box input:focus { outline: none; border-color: #2d5a8e; box-shadow: 0 0 0 3px rgba(30,58,95,.1); }
    .login-btn { width: 100%; padding: 14px; background: #1e3a5f; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; }
    .login-btn:hover { background: #2d5a8e; }
    .login-error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: .9rem; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>الوسام للخدمات الجامعية</h1>
    <p class="sub">نظام الإيرادات والمصاريف والأرشفة</p>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" name="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" name="password" required placeholder="••••••">
      </div>
      <button type="submit" class="login-btn">🔐 تسجيل الدخول</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const err = document.getElementById('loginError');
      err.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        if (!res.ok) {
          err.textContent = result.error || 'خطأ في تسجيل الدخول';
          err.style.display = 'block';
          return;
        }
        window.location.href = '/';
      } catch {
        err.textContent = 'تعذر الاتصال بالخادم';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
