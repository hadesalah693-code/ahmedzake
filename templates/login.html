<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2744">
  <title>تسجيل الدخول - الوسام للخدمات الجامعية</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-logo">🏆</div>
    <h1>الوسام للخدمات الجامعية</h1>
    <p class="sub">نظام الإيرادات والمصاريف والأرشفة</p>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" name="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" name="password" required placeholder="••••••">
      </div>
      <button type="submit" class="login-btn">🔐 تسجيل الدخول</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const err = document.getElementById('loginError');
      err.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        if (!res.ok) {
          err.textContent = result.error || 'خطأ في تسجيل الدخول';
          err.style.display = 'block';
          return;
        }
        window.location.href = '/';
      } catch {
        err.textContent = 'تعذر الاتصال بالخادم';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
